[package]
name = "beledarians-markdown-editor"
version = "0.1.0"
description = "Native desktop runtime for Beledarians Markdown Editor"
authors = ["Beledarian"]
license = "MIT"
repository = "https://github.com/Beledarian/beledarians-markdown-editor"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = []
cua-verifier = []

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
reqwest = { version = "0.13", features = ["json", "blocking", "stream"] }
tauri = { version = "2.11.1", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-log = "2"
tauri-plugin-fs = "2.5.1"
tauri-plugin-shell = "2.3.4"
tauri-plugin-dialog = "2.5.0"
tauri-plugin-single-instance = "2.3.7"
tokio = { version = "1", features = ["time"] }
tauri-plugin-autostart = "2"
tauri-plugin-os = "2"
urlencoding = "2"
